# Reverse proxy: the only public entry point. The API container is not exposed.
events {}

http {
    # The agent calls a local LLM (slow, CPU-heavy): 6 requests per minute per IP, small bursts.
    limit_req_zone $binary_remote_addr zone=ask:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;

    upstream api {
        server api:8000;
    }

    server {
        listen 80;
        client_max_body_size 64k;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location = /api/ask {
            limit_req zone=ask burst=3 nodelay;
            proxy_read_timeout 180s;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
